name: CI
on:
  pull_request:
  push:
    branches:
      - 'main'
jobs:
  test:
    name: Small test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/setup-aqua
        with:
          save-cache: true
      - run: |
          cat > ./e2e/manifests/website/.ssh/id_rsa <<EOF
          ${{ secrets.DEPLOY_KEY }}
          EOF
      - run: chmod 0600 ./e2e/manifests/website/.ssh/id_rsa
      - run: make test
  ui:
    uses: ./.github/workflows/frontend.yaml
    permissions:
      contents: read
      id-token: write
  e2e:
    name: End-to-end Test
    runs-on: ubuntu-24.04
    needs: [test, ui]
    permissions:
      contents: read
    strategy:
      matrix:
        k8s-version:
          - v1.33.7@sha256:d26ef333bdb2cbe9862a0f7c3803ecc7b4303d8cea8e814b481b09949d353040 # renovate: kindest/node
          - v1.34.3@sha256:08497ee19eace7b4b5348db5c6a1591d7752b164530a36f855cb0f2bdcbadd48 # renovate: kindest/node
          - v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f # renovate: kindest/node
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/download-ui-dist
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/setup-aqua
      - run: |
          cat > ./e2e/manifests/website/.ssh/id_rsa <<EOF
          ${{ secrets.DEPLOY_KEY }}
          EOF
      - run: chmod 0600 ./e2e/manifests/website/.ssh/id_rsa
      - run: make test KUBERNETES_VERSION=${{ matrix.k8s-version }}
        id: run_e2e_test
        working-directory: e2e
      - if: failure() && steps.run_e2e_test.outcome == 'failure'
        run: |
          kubectl get pod
          kubectl describe pod
  check-e2e-test:
    name: All e2e tests passed
    runs-on: ubuntu-slim
    needs: e2e
    permissions: {}
    steps:
      - run: echo ok
  builders:
    name: Build builder containers
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: &images
          - ubuntu
          - nginx
          - node
          - python
          - elasticsearch
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: linux/amd64,linux/arm64
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          platforms: linux/amd64,linux/arm64
      - name: GHCR Login
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Get tags
        id: get_tags
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          echo "BASE_TAG=$(cat containers/BASE_TAG)" > "$GITHUB_OUTPUT"
          echo "TAG=$(cat containers/${IMAGE}/TAG)" >> "$GITHUB_OUTPUT"
      - name: Check builder images existence
        id: check_existence
        env:
          IMAGE: ghcr.io/cybozu-go/website-operator-${{ matrix.image }}
          TAG: ${{ steps.get_tags.outputs.TAG }}
        run: |
          # This command returns 1 when the manifest does not exist, but it can also return 1 for other errors (e.g., network issues).
          # To avoid false negatives, we check the output message.
          set +e
          INSPECT_OUTPUT=$(docker manifest inspect "${IMAGE}:${TAG}" 2>&1)
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -eq 0 ]; then
            echo "Image ${IMAGE}:${TAG} already exists. Skipping push."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif echo "${INSPECT_OUTPUT}" | grep -qE "manifest unknown"; then
            echo "Image ${IMAGE}:${TAG} does not exist. It will be pushed when the branch is main."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "Failed to check image existence: ${INSPECT_OUTPUT}"
            exit 1
          fi
      - name: Build and push docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          push: ${{ github.ref_name == 'main' && steps.check_existence.outputs.exists == 'false' }}
          context: containers/${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/cybozu-go/website-operator-${{ matrix.image }}:${{ steps.get_tags.outputs.TAG }}
          build-args: |
            BASE_TAG=${{ steps.get_tags.outputs.BASE_TAG }}
  wait-for-build-images:
    name: All builder images are built
    runs-on: ubuntu-slim
    needs: builders
    permissions: {}
    steps:
      - run: echo ok
  scan-images:
    name: Scan images
    needs: wait-for-build-images
    if: github.ref_name == 'main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: *images
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-cosign
      - uses: ./.github/actions/setup-trivy
      - uses: ./.github/actions/setup-yamory-scripts
      - name: Login to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan images
        env:
          YAMORY_ACCESS_TOKEN: ${{ secrets.YAMORY_ACCESS_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
        run: |
          TAG=$(cat ./containers/${IMAGE}/TAG)
          if [ -z "$TAG" ]; then
            echo "TAG file is empty or not found"
            exit 1
          fi
          echo "scanning website-operator-${IMAGE}:${TAG} ..."
          export YAMORY_IMAGE_NAME="ghcr.io/${REPO_OWNER}/website-operator-${IMAGE}:${TAG}"
          export YAMORY_IMAGE_IDENTIFIER="ghcr.io/${REPO_OWNER}/website-operator-${IMAGE}"
          yamory-image-scan
  check-goreleaser-config:
    name: Check goreleaser.yml
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-aqua
      - name: run goreleaser check
        run: |
          goreleaser check -f .goreleaser.yml
  tilt:
    name: Run tilt ci
    runs-on: ubuntu-24.04
    needs: [ui]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/download-ui-dist
      - uses: ./.github/actions/setup-aqua
      - run: make dev
      - run: tilt ci
  dry-run:
    name: Dry-run release
    runs-on: ubuntu-24.04
    needs: [ui, check-goreleaser-config]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/download-ui-dist
      - uses: ./.github/actions/setup-aqua
      - name: Setup tag for goreleaser
        run: |
          echo "GORELEASER_CURRENT_TAG=$(git describe --tags --abbrev=0 --match "v*" || echo v0.0.0)" >> $GITHUB_ENV
      - name: run goreleaser in dry-run mode
        run: |
          goreleaser release --snapshot --skip=publish,before --clean
