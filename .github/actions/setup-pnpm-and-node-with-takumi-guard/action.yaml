name: Setup Pnpm and Node with Takumi Guard
description: Set up Pnpm and Node and Takumi Guard
inputs:
  bot-id:
    description: Takumi Guard bot ID
    required: true

runs:
  using: composite
  steps:
    - name: Check if Fork PR
      id: check-fork
      shell: bash
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ] && \
           [ "${GITHUB_EVENT_PULL_REQUEST_HEAD_REPO_FULL_NAME}" != "${{ github.repository }}" ]; then
          echo "is_fork=true" >> "$GITHUB_OUTPUT"
        else
          echo "is_fork=false" >> "$GITHUB_OUTPUT"
        fi
      env:
        GITHUB_EVENT_PULL_REQUEST_HEAD_REPO_FULL_NAME: ${{ github.event.pull_request.head.repo.full_name }}

    - name: Require Takumi Guard bot ID
      if: steps.check-fork.outputs.is_fork == 'false'
      shell: bash
      env:
        BOT_ID: ${{ inputs.bot-id }}
      run: |
        if [ -z "$BOT_ID" ]; then
          echo "::error::bot-id is required."
          exit 1
        fi

    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: 11
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26
        cache: 'pnpm'
        cache-dependency-path: ./pnpm-lock.yaml

    - name: Setup Takumi Guard (Organization)
      if: steps.check-fork.outputs.is_fork == 'false'
      uses: flatt-security/setup-takumi-guard-npm@14f07d0cbc739b42a1b7c70a04c2b84cd1318ddd # v1.4.0
      with:
        bot-id: ${{ inputs.bot-id }}

    - name: Setup Takumi Guard (Anonymous)
      if: steps.check-fork.outputs.is_fork == 'true'
      uses: flatt-security/setup-takumi-guard-npm@14f07d0cbc739b42a1b7c70a04c2b84cd1318ddd # v1.4.0
