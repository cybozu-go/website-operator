name: Setup Pnpm and Node with Takumi Guard
description: Set up Pnpm and Node and Takumi Guard
inputs:
  bot-id:
    description: Takumi Guard bot ID
    required: true

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: 11
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26
        cache: 'pnpm'
        cache-dependency-path: ./pnpm-lock.yaml
    - uses: flatt-security/setup-takumi-guard-npm@14f07d0cbc739b42a1b7c70a04c2b84cd1318ddd # v1.4.0
      with:
        bot-id: ${{ inputs.bot-id }}
