apiVersion: website.zoetrope.github.io/v1beta1
kind: WebSite
metadata:
  name: honkit-sample-es
  namespace: default
spec:
  buildImage: ghcr.io/cybozu-go/website-operator-node:dev
  buildScript:
    configMap:
      name: build-scripts
      key: build-honkit.sh
  buildSecrets:
    - name: build-secret
      key: SEARCH_HOST
  repoURL: https://github.com/neco-test/honkit-sample.git
  afterBuildScript:
    configMap:
      name: after-build-scripts
      key: create-honkit-search-index.sh
  branch: main
  extraResources:
    - configMap:
        name: httpproxy
        key: httpproxy-es.tmpl
